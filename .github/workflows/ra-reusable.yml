name: RA reusable

# Sandbox proof for the review assistant's reusable workflow. Dummy values only.

on:
  workflow_call:
    inputs:
      lens:
        type: string
        required: true
      label:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
      hold:
        type: number
        default: 0
      key:
        type: string
        default: "1"
    secrets:
      RA_DUMMY_ANALYSIS:
        required: true
      RA_DUMMY_PUBLISH:
        required: true

permissions: {}

jobs:
  gate:
    name: ${{ inputs.label }} gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show the refs and the switch
        env:
          SWITCH: ${{ vars.RA_LENSES }}
          LENS: ${{ inputs.lens }}
        run: |
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "LENS=$LENS"
          echo "GATE_SWITCH=$SWITCH"

  analysis:
    name: ${{ inputs.label }} analysis ${{ inputs.key }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ra-analysis
      deployment: false
    concurrency:
      group: ${{ inputs.lens }}-review-analysis-${{ inputs.key }}
      cancel-in-progress: false
    steps:
      - name: Check the secrets by name, then hold
        env:
          ANALYSIS_SECRET: ${{ secrets.RA_DUMMY_ANALYSIS }}
          PUBLISH_SECRET: ${{ secrets.RA_DUMMY_PUBLISH }}
          HOLD: ${{ inputs.hold }}
        run: |
          echo "ANALYSIS_SECRET_IN_ANALYSIS=${ANALYSIS_SECRET:+present}"
          echo "PUBLISH_SECRET_IN_ANALYSIS=${PUBLISH_SECRET:+present}"
          echo "STARTED=$(date -u +%H:%M:%S)"
          sleep "$HOLD"
          echo "ENDED=$(date -u +%H:%M:%S)"

  publish:
    name: ${{ inputs.label }} publish ${{ inputs.key }}
    needs: [gate, analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ra-publish
      deployment: false
    permissions:
      actions: read
    steps:
      - name: Read the switch again and decide
        env:
          ANALYSIS_SECRET: ${{ secrets.RA_DUMMY_ANALYSIS }}
          PUBLISH_SECRET: ${{ secrets.RA_DUMMY_PUBLISH }}
          SWITCH: ${{ vars.RA_LENSES }}
          ENV_SWITCH: ${{ vars.RA_ENV_SWITCH }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "PUBLISH_ENV_SWITCH=$ENV_SWITCH"
          code=$(curl -s -o "$RUNNER_TEMP/v.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/variables/RA_LENSES")
          echo "REST_STATUS=$code"
          echo "REST_VALUE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("value"))' "$RUNNER_TEMP/v.json")"
          echo "ANALYSIS_SECRET_IN_PUBLISH=${ANALYSIS_SECRET:+present}"
          echo "PUBLISH_SECRET_IN_PUBLISH=${PUBLISH_SECRET:+present}"
          echo "PUBLISH_SWITCH=$SWITCH"
          echo "DRY_RUN_INPUT=$DRY_RUN"
          if [ "$DRY_RUN" = "false" ]; then echo "RESULT=WOULD POST"; else echo "RESULT=posts nothing"; fi
