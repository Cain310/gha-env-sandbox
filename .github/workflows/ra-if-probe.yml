name: RA if probe

run-name: "RA if probe ${{ inputs.key }}"

# Sandbox proof: how the dispatcher's switch comparisons treat a value's type and case.

on:
  workflow_dispatch:
    inputs:
      key:
        type: string
        default: "1"

permissions: {}

jobs:
  as-written:
    name: plan's filter
    if: >-
      fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'true'
      || (fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'manual'
          && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: echo "passed"
  with-boolean:
    name: filter that also passes a boolean true
    if: >-
      fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'true'
      || fromJSON(vars.RA_LENSES || '{}').dal.enabled == true
      || (fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'manual'
          && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          DRY: ${{ fromJSON(vars.RA_LENSES || '{}').dal.dry_run != 'false' }}
        run: echo "passed; DRY_RUN_INPUT=$DRY"
