name: dispatch
run-name: "SIDE-BASE copy review PR #${{ github.event.pull_request.number || inputs.pr_number }}"

# Small dispatcher. Calls the engine's reusable workflow pinned by full commit SHA.

on:
  pull_request_target:
    types: [review_requested, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      checks: write
    uses: Cain310/gha-env-sandbox-engine/.github/workflows/review.yml@b71dd71f40f3643c3f983ae89b2f55767daa246d
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      head_sha: ${{ github.event.pull_request.head.sha || '' }}
    secrets:
      ANALYSIS_KEY: ${{ secrets.ANALYSIS_KEY }}
      PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
      PASSED_ANALYSIS_KEY: ${{ secrets.ANALYSIS_KEY }}
