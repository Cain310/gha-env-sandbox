name: RA assistant (dal)

run-name: "RA assistant (dal) key ${{ inputs.key }}"

# Sandbox proof: the new dispatcher, switched by the dal entry of the JSON variable RA_LENSES.

on:
  workflow_dispatch:
    inputs:
      hold:
        description: Seconds the analysis job holds.
        type: number
        default: 0
      key:
        description: Stands in for the PR number in names and groups.
        type: string
        default: "1"

permissions: {}

jobs:
  review:
    name: review
    if: >-
      fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'true'
      || (fromJSON(vars.RA_LENSES || '{}').dal.enabled == 'manual'
          && github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ra-reusable.yml
    with:
      lens: dal
      label: DAL
      dry_run: ${{ fromJSON(vars.RA_LENSES || '{}').dal.dry_run != 'false' }}
      # A workflow_dispatch number input arrives as a string, and the called workflow wants a number.
      hold: ${{ fromJSON(inputs.hold) }}
      key: ${{ inputs.key }}
    secrets:
      RA_DUMMY_ANALYSIS: ${{ secrets.RA_DUMMY_ANALYSIS }}
      RA_DUMMY_PUBLISH: ${{ secrets.RA_DUMMY_PUBLISH }}
